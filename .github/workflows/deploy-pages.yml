name: MangaHive — Phase 1 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate required deployment secrets
        env:
          SUPABASE_URL: ${{ secrets.MANGAHIVE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.MANGAHIVE_SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.MANGAHIVE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing MANGAHIVE_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing MANGAHIVE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "Missing MANGAHIVE_GOOGLE_CLIENT_ID"; exit 1; }
          case "$SUPABASE_URL" in https://*) ;; *) echo "Supabase URL must use https://"; exit 1 ;; esac

      - name: Validate repository deployment inputs
        run: |
          set -e
          required=(
            index.html manifest.json sw.js vendor-supabase.js
            icon-192.png icon-512.png icon-maskable-512.png
            config/runtime-config.js config/runtime-config.production.js
            tests/phase0 tests/phase1 src/domain src/services
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "Missing deployment input: $path"; exit 1; }
          done

      - name: Run Phase 0 and Phase 1 regression tests
        run: |
          set -e
          for file in $(find tests/phase0 tests/phase1 -type f -name '*test.js' | sort); do
            echo "=== $file ==="
            node "$file"
          done

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in $(find src config -type f -name '*.js' | sort); do
            node --check "$file"
          done
          node --check sw.js

      - name: Generate production runtime configuration
        env:
          SUPABASE_URL: ${{ secrets.MANGAHIVE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.MANGAHIVE_SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.MANGAHIVE_GOOGLE_CLIENT_ID }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = ['SUPABASE_URL', 'SUPABASE_ANON_KEY', 'GOOGLE_CLIENT_ID'];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing ${name}`);
          }
          const esc = (v) => JSON.stringify(v);
          const out = `/** Generated by GitHub Actions. Do not commit environment values. */\n` +
            `window.__MANGAHIVE_CONFIG__ = {\n` +
            `  env: 'github-pages',\n` +
            `  supabaseUrl: ${esc(process.env.SUPABASE_URL)},\n` +
            `  supabaseAnonKey: ${esc(process.env.SUPABASE_ANON_KEY)},\n` +
            `  googleClientId: ${esc(process.env.GOOGLE_CLIENT_ID)},\n` +
            `};\n`;
          fs.writeFileSync('config/runtime-config.production.js', out, 'utf8');
          NODE

      - name: Verify generated production configuration
        run: |
          set -e
          ! grep -q 'YOUR_PROJECT\|YOUR_ANON_KEY\|YOUR_GOOGLE_CLIENT_ID' config/runtime-config.production.js
          grep -q 'window.__MANGAHIVE_CONFIG__' config/runtime-config.production.js

      - name: Assemble Pages artifact
        run: |
          set -e
          rm -rf _pages
          mkdir -p _pages/config _pages/src/domain _pages/src/services
          cp index.html manifest.json sw.js vendor-supabase.js icon-192.png icon-512.png icon-maskable-512.png _pages/
          cp config/runtime-config.js config/runtime-config.production.js _pages/config/
          cp src/domain/chapterOrder.js src/domain/chapterSystem.js src/domain/identity.js src/domain/mangaDetails.js src/domain/progress.js src/domain/readerKeyboard.js src/domain/readerPages.js src/domain/readerSession.js src/domain/readingContinuity.js src/domain/searchResult.js _pages/src/domain/
          cp src/services/chapterService.js src/services/discoverySearch.js src/services/libraryStore.js src/services/progressStore.js src/services/readerPageService.js src/services/startupCoordinator.js _pages/src/services/
          touch _pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
