# Pinned upstream compatibility inputs. Every entry says WHY it exists and WHERE the pin came from.
# Source for the 1.6 host-requirement table: https://github.com/mihonapp/tachiyomix README
# ("App Requirements", fetched from `main` on 2026-10-01). Re-check against tag 1.6.0 with verify-pins.sh:
# the same README showed DIFFERENT versions in an earlier snapshot (coroutines 1.10.2, serialization 1.7.3,
# okhttp 5.4.0, jsoup 1.22.2), so the table has drifted on `main`.

[versions]
# Toolchain (documentation: developer.android.com AGP 9.1.1 notes: supports API 37, needs Gradle 9.3.1)
agp = "9.1.1"
# tachiyomix README: Kotlin kotlin-stdlib 2.4.0
kotlin = "2.4.0"

# The extension API itself. README: compileOnly("com.github.mihonapp:tachiyomix:1.6").
# RESOLVED (Stage 6.6A): JitPack serves "1.6.0" (pom/aar HTTP 200); "1.6" is HTTP 404. The AAR's classes.jar is the ABI reference.
tachiyomix16 = "1.6.0"

# Host-provided libs the stubs expose in signatures (README "App Requirements").
coroutines = "1.11.0"       # suspend source API (Source.getPopularManga etc.)
serialization = "1.11.0"    # SManga.memo / SChapter.memo are JsonObject
okhttp = "5.5.0"            # Request/Response/Headers/Call in HttpSource signatures (also okhttp-brotli, okhttp-zstd on host)
jsoup = "1.23.1"            # extensions parse HTML; host-provided
injekt = "91edab2317"       # README coordinate com.github.mihonapp:injekt (Mihon app itself moved to uy.kohesive.injekt:injekt-core:1.16.1; see README)
rxjava = "1.3.8"            # tachiyomix 1.6.0 pom (runtime): deprecated Rx Source API (rx.Observable in signatures)
preference = "1.2.1"        # androidx.preference: ConfigurableSource signature only (compileOnly; not routed to extensions)
junit = "4.13.2"
orgjson = "20240303"        # JVM unit tests only: Android's org.json is a stub off-device

[libraries]
tachiyomix-v16 = { module = "com.github.mihonapp:tachiyomix", version.ref = "tachiyomix16" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
injekt = { module = "com.github.mihonapp:injekt", version.ref = "injekt" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
junit = { module = "junit:junit", version.ref = "junit" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
